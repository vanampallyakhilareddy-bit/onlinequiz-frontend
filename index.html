<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 30px;
        }
        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #cccccc;
        }
        h1 { color: #4338ca; }
        #question {
            font-size: 21px;
            margin: 25px 0;
        }
        button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #3730a3; }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        #message {
            font-weight: bold;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Online Quiz Application</h1>
        <p>Test your Java knowledge!</p>
        <p id="progress"></p>
        <h2 id="question">Loading questions...</h2>
        <div id="options"></div>
        <p id="message" role="status"></p>
        <button id="next" onclick="nextQuestion()" hidden>
            Next Question
        </button>
        <h3 id="score"></h3>
    </div>

    <script>
        const API_URL =
            'https://onlinequiz-backend-1.onrender.com/api/quiz';

        let questions = [];
        let current = 0;
        let points = 0;
        let answered = false;

        async function loadQuiz() {
            const questionElement =
                document.getElementById('question');

            questionElement.textContent = 'Loading questions...';

            document.getElementById('message').textContent = '';
            document.getElementById('options').innerHTML = '';
            document.getElementById('progress').textContent = '';
            document.getElementById('next').hidden = true;

            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(
                        'Server returned HTTP ' + response.status
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error(
                        'The server returned no quiz questions.'
                    );
                }

                questions = data;

                const validQuestions = questions.every(q =>
                    q &&
                    typeof q.question === 'string' &&
                    typeof q.answer === 'string' &&
                    [1, 2, 3, 4].some(i =>
                        typeof q['option' + i] === 'string'
                    )
                );

                if (!validQuestions) {
                    throw new Error(
                        'Quiz data has a missing question, option, or answer.'
                    );
                }

                current = 0;
                points = 0;
                showQuestion();

            } catch (error) {
                console.error('Quiz loading error:', error);

                // UPDATED: Display the actual error on the webpage.
                questionElement.textContent =
                    'Unable to load quiz: ' + error.message;

                document.getElementById('options').innerHTML = '';
                document.getElementById('progress').textContent = '';
                document.getElementById('next').hidden = true;

                document.getElementById('message').textContent =
                    'Please check your internet connection or try again later.';

                const retryButton = document.createElement('button');
                retryButton.textContent = 'Retry Loading Quiz';
                retryButton.onclick = loadQuiz;

                document.getElementById('options')
                    .appendChild(retryButton);
            }
        }

        function showQuestion() {
            answered = false;

            document.getElementById('message').textContent = '';
            document.getElementById('score').textContent = '';
            document.getElementById('next').hidden = true;

            document.getElementById('progress').textContent =
                'Question ' + (current + 1) +
                ' of ' + questions.length;

            document.getElementById('question').textContent =
                questions[current].question;

            const area = document.getElementById('options');
            area.innerHTML = '';

            for (let i = 1; i <= 4; i++) {
                const key = 'option' + i;
                const option = questions[current][key];

                if (typeof option !== 'string') continue;

                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => checkAnswer(option, button);

                area.appendChild(button);
            }
        }

        function checkAnswer(choice, selectedButton) {
            if (answered) return;

            answered = true;

            const correct = questions[current].answer;

            const buttons =
                document.querySelectorAll('#options button');

            buttons.forEach(button => {
                button.disabled = true;
            });

            if (choice === correct) {
                points++;

                document.getElementById('message').textContent =
                    'Correct!';
            } else {
                document.getElementById('message').textContent =
                    'Incorrect. Correct answer: ' + correct;
            }

            document.getElementById('next').hidden = false;
        }

        function nextQuestion() {
            current++;

            if (current < questions.length) {
                showQuestion();
            } else {
                document.getElementById('question').textContent =
                    'Quiz Completed!';

                document.getElementById('options').innerHTML = '';
                document.getElementById('progress').textContent = '';

                document.getElementById('message').textContent =
                    'Your final score:';

                document.getElementById('score').textContent =
                    points + ' / ' + questions.length;

                document.getElementById('next').hidden = true;
            }
        }

        loadQuiz();
    </script>
</body>
</html>
